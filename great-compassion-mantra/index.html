<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Nīlakaṇṭha Dhāraṇī</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --bg:#ECEAF1; --surface:#F8F7FB; --ink:#1E1A2B; --muted:#6D6880; --faint:#A9A4B8;
    --hair:rgba(30,26,43,.14); --seal:#A8352A; --gold:#8E7230; --scrim:rgba(30,26,43,.42);
    --shadow:0 24px 60px rgba(30,26,43,.18);
    --zh:"Noto Serif TC","Songti TC","Songti SC","PMingLiU","SimSun","Noto Serif CJK TC",serif;
    --sa:"Gentium Book Plus","Gentium Plus","Charis SIL","Georgia","Times New Roman",serif;
    --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12101A; --surface:#1B1826; --ink:#EDE9F5; --muted:#9A94AD; --faint:#5F5A72;
      --hair:rgba(237,233,245,.14); --seal:#D65A4C; --gold:#D2B064; --scrim:rgba(0,0,0,.55);
      --shadow:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12101A; --surface:#1B1826; --ink:#EDE9F5; --muted:#9A94AD; --faint:#5F5A72;
    --hair:rgba(237,233,245,.14); --seal:#D65A4C; --gold:#D2B064; --scrim:rgba(0,0,0,.55);
    --shadow:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:4px}

  .app{height:100%;display:flex;flex-direction:column;padding-inline:16px}

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;min-height:56px}
  .menu{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;border-radius:8px}
  .menu:hover{background:var(--hair)}
  .menu span{display:block;width:22px;height:2px;background:var(--ink);border-radius:1px;box-shadow:0 -7px 0 var(--ink),0 7px 0 var(--ink)}
  .bar-title{flex:1;text-align:center;min-width:0}
  .bar-title .zh{font-family:var(--zh);font-size:15px;letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-title .sa{font-family:var(--sa);font-size:12.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:56px;text-align:right;letter-spacing:.04em}
  .counter b{color:var(--ink);font-weight:500}

  /* stage */
  .stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
  .card{width:100%;max-width:640px;text-align:center;display:flex;flex-direction:column;gap:clamp(14px,3vh,26px);padding-block:8px;transition:opacity .26s ease, transform .26s ease}
  .card.is-out{opacity:0;transform:translateY(-6px)}
  .card.is-in{opacity:0;transform:translateY(8px)}
  .eyebrow{display:flex;justify-content:center;align-items:baseline;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .eyebrow .num{font-family:var(--zh);color:var(--seal);letter-spacing:.2em;font-size:13px;text-transform:none}
  .eyebrow .ref{font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .zh-line{font-family:var(--zh);font-weight:400;font-size:clamp(30px,7.6vw,50px);line-height:1.25;letter-spacing:.1em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
  .zh-line .g{color:var(--faint);font-size:.42em;letter-spacing:.1em;vertical-align:.35em;margin-left:.2em}
  .sa-line{font-family:var(--sa);font-size:clamp(21px,4.6vw,29px);line-height:1.3;color:var(--gold);text-wrap:balance}
  .en-line{font-family:var(--sa);font-style:italic;font-size:clamp(17px,3.6vw,21px);line-height:1.45;color:var(--ink);max-width:34em;margin:0 auto;text-wrap:balance}
  .gl-line{font-family:var(--zh);font-size:clamp(14px,3vw,16px);line-height:1.7;color:var(--muted);letter-spacing:.06em;text-wrap:balance}
  .rule{width:38px;height:1px;background:var(--hair);margin:0 auto}
  .lit-line{font-family:var(--zh);font-size:clamp(14px,3.2vw,17px);letter-spacing:.12em;color:var(--muted);margin-top:-6px}
  .lit-line .k{font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-right:10px;color:var(--faint)}
  .lit-line mark{background:none;color:var(--seal)}
  .lang-hidden{display:none}

  /* completion card */
  .done .zh-line{font-size:clamp(26px,6vw,40px)}
  .done p{margin:0;color:var(--muted);max-width:32em;margin-inline:auto}

  /* bottom */
  .foot{display:flex;align-items:center;gap:14px;padding-block:10px 16px;color:var(--muted);font-size:12.5px}
  .back{width:44px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
  .back:hover{background:var(--hair);color:var(--ink)}
  .back:disabled{opacity:.3;cursor:default;background:none}
  .track{flex:1;display:flex;gap:2px;height:14px;align-items:center}
  .track i{flex:1;height:3px;background:var(--hair);border-radius:1px;transition:background .3s}
  .track i.on{background:var(--seal)}
  .track i.cur{background:var(--ink);height:7px}
  .hint{flex:none;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
  @media (max-width:420px){.hint{display:none}}

  /* drawer */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);transform:translateX(-104%);transition:transform .32s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.open .scrim{opacity:1;pointer-events:auto}
  body.open .drawer{transform:none}
  .d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--hair)}
  .d-head h2{margin:0;font-family:var(--sa);font-weight:400;font-size:20px;letter-spacing:.01em}
  .d-head h2 small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  .close{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;font-size:22px;line-height:1;color:var(--muted)}
  .close:hover{background:var(--hair);color:var(--ink)}
  .d-body{overflow-y:auto;padding:6px 20px 24px;flex:1}
  .sec{padding-block:14px;border-bottom:1px solid var(--hair)}
  .sec:last-child{border-bottom:0}
  .sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  dl{margin:0;display:grid;grid-template-columns:1fr auto;column-gap:16px;row-gap:6px;align-items:baseline}
  dt{color:var(--ink)}
  dt small{display:block;color:var(--muted);font-size:12px}
  dd{margin:0;font-variant-numeric:tabular-nums;text-align:right;font-size:17px;font-family:var(--sa);white-space:nowrap}
  dd small{font-family:var(--ui);font-size:12px;color:var(--muted);margin-left:4px}
  .toggles{display:flex;flex-direction:column;gap:8px}
  .toggles label{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .toggles input{accent-color:var(--seal);width:18px;height:18px;margin:0}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .btn{padding:8px 14px;border:1px solid var(--hair);border-radius:6px;font-size:13.5px;letter-spacing:.02em}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--seal);color:#fff;border-color:var(--seal)}
  .jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
  .jump button{height:32px;border:1px solid var(--hair);border-radius:4px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .jump button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .jump button.seen{color:var(--ink);border-color:var(--seal)}
  .jump button:hover{border-color:var(--ink)}
  .src{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
  .src b{color:var(--ink);font-weight:500;display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
  .src a{color:var(--seal)}

  /* floating view toggle (icon only) */
  .fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;background:var(--surface);border:1px solid var(--hair);box-shadow:0 8px 24px rgba(30,26,43,.16);display:grid;place-items:center;color:var(--ink);z-index:5;transition:transform .2s, background .2s}
  .fab:hover{transform:translateY(-1px)}
  .fab:active{transform:scale(.96)}
  .fab svg{width:22px;height:22px;display:block}
  .fab .ic-full{display:block}.fab .ic-card{display:none}
  body.mode-full .fab .ic-full{display:none}body.mode-full .fab .ic-card{display:block}
  .foot{padding-right:62px}
  .scrim{z-index:10}.drawer{z-index:11}

  /* full-text view */
  .full{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 96px;-webkit-overflow-scrolling:touch}
  body.mode-full .stage,body.mode-full .foot{display:none}
  body.mode-full .full{display:block}
  .full ol{list-style:none;margin:0 auto;padding:0;max-width:640px}
  .full li{padding:18px 4px 20px;border-bottom:1px solid var(--hair);cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .full li:hover{background:var(--hair)}
  .full li.cur{box-shadow:inset 3px 0 0 var(--seal);padding-left:14px}
  .full .eyebrow{justify-content:flex-start;gap:12px}
  .full .zh-line{font-size:clamp(22px,5.4vw,30px);text-align:left;letter-spacing:.08em;line-height:1.35}
  .full .lit-line{font-size:14px;margin-top:0;text-align:left}
  .full .sa-line{font-size:clamp(17px,4vw,20px);text-align:left}
  .full .en-line{font-size:clamp(15px,3.4vw,17px);text-align:left;margin:0;max-width:none}
  .full .gl-line{font-size:14px;text-align:left}
  .full .end{color:var(--muted);text-align:center;font-size:13px;padding:28px 0 8px;letter-spacing:.06em}

  @media (prefers-reduced-motion: reduce){
    .card,.drawer,.scrim,.track i{transition:none}
  }
</style>
</head>

</aside>

  if (window.claude && window.claude.hot && window.claude.hot.data && typeof window.claude.hot.data.i === 'number') state = Object.assign(state, window.claude.hot.data);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return state; });
  function persist(){ try { localStorage.setItem('nilakantha-viewer', JSON.stringify({i:state.i, seen:state.seen, show:state.show, full:state.full})); } catch(e){} }

  // ---------- statistics ----------
  var isCJK = function(ch){ var c = ch.codePointAt(0); return (c>=0x3400&&c<=0x9FFF)||(c>=0x20000&&c<=0x2FFFF); };
  function cjkChars(s){ return Array.from(s).filter(isCJK); }
  function words(s){ return s.replace(/\([^)]*\)/g,' ').replace(/[\[\]().,;:?!’‘“”]/g,' ').split(/\s+/).filter(function(w){ return /[A-Za-zÀ-ɏḀ-ỿ]/.test(w); }); }
  function joinSa(){ return L.map(function(l){return l.sa;}).join(' ').replace(/-\s+-/g,''); }
  var zhAll = L.map(function(l){return l.zh;}).join('');
  var zhChars = cjkChars(zhAll);
  var zhUnique = new Set(zhChars).size;
  var glChars = cjkChars(L.map(function(l){return l.zh_gloss;}).join(''));
  var saWords = words(joinSa());
  var enWords = L.reduce(function(a,l){ return a + words(l.en).length; }, 0);
  var svaha = L.filter(function(l){ return /^svāhā$/i.test(l.sa.trim()); }).length;
  var nila = L.filter(function(l){ return /nīlakaṇṭh/i.test(l.sa); }).length;
  var longest = L.reduce(function(a,l){ return cjkChars(l.zh).length > cjkChars(a.zh).length ? l : a; }, L[0]);
  var shortest = L.reduce(function(a,l){ return cjkChars(l.zh).length < cjkChars(a.zh).length ? l : a; }, L[0]);
  var refs = new Set(L.map(function(l){return l.ref;})).size;
  var litDiff = L.filter(function(l){ return l.zh_lit && l.zh_lit.replace(/　/g,'') !== l.zh; }).length;
  var S = DATA.sutra;
  var fmt = function(n){ return n.toLocaleString('en-US'); };

  // ---------- render helpers ----------
  var card = document.getElementById('card'), counter = document.getElementById('counter'), track = document.getElementById('track'), backBtn = document.getElementById('backBtn'), hint = document.getElementById('hint');
  var esc = function(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  for (var k=0;k<N;k++){ var t=document.createElement('i'); track.appendChild(t); }
  var ticks = track.children;

  function lineHTML(l){
    var h = '';
    h += '<div class="eyebrow"><span class="num">第' + toZhNum(l.n) + '句</span><span class="ref">Taishō ' + esc(l.ref.replace('T20n1060_p','20.1060.')) + '</span>' + (l.lit !== String(l.n) ? '<span class="ref">liturgical ' + esc(l.lit) + '</span>' : '') + '</div>';
    h += '<div class="zh-line" lang="zh-Hant">' + esc(l.zh) + (l.note_zh ? '<span class="g">(' + esc(l.note_zh) + ')</span>' : '') + '</div>';
    if (l.zh_lit && l.zh_lit.replace(/　/g,'') !== l.zh) h += '<div class="lit-line' + (state.show.lit?'':' lang-hidden') + '" lang="zh-Hant"><span class="k">As sung</span>' + markDiff(l.zh, l.zh_lit) + '</div>';
    h += '<div class="rule"></div>';
    h += '<div class="sa-line' + (state.show.sa?'':' lang-hidden') + '" lang="sa-Latn">' + esc(l.sa) + '</div>';
    h += '<div class="en-line' + (state.show.en?'':' lang-hidden') + '" lang="en">' + esc(l.en) + '</div>';
    h += '<div class="gl-line' + (state.show.gl?'':' lang-hidden') + '" lang="zh-Hant">' + esc(l.zh_gloss) + '</div>';
    return h;
  }
  function doneHTML(){
    return '<div class="done">' +
      '<div class="eyebrow"><span class="num">圓滿</span><span class="ref">' + N + ' phrases · ' + fmt(zhChars.length) + ' characters</span></div>' +
      '<div class="zh-line" lang="zh-Hant">唵悉殿都　曼哆囉鉢馱耶　娑婆訶</div>' +
      '<div class="rule"></div>' +
      '<div class="sa-line" lang="sa-Latn">oṃ sidhyantu mantra-padāni svāhā</div>' +
      '<p>You have read the whole dhāraṇī as Bhagavaddharma set it down in the seventh century. Tap to begin again from the first phrase, or open the menu for statistics.</p>' +
      '</div>';
  }
  function markDiff(a, b){
    // LCS over characters; characters of b not matched to a are highlighted
    var A=Array.from(a), B=Array.from(b), m=A.length, n=B.length, dp=[];
    for (var i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); }
    for (i=m-1;i>=0;i--) for (var j=n-1;j>=0;j--) dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    var out='', x=0, y=0;
    while (x<m && y<n){ if (A[x]===B[y]){ out+=esc(B[y]); x++; y++; } else if (dp[x+1][y] >= dp[x][y+1]) x++; else { out += B[y]==='　' ? '　' : '<mark>'+esc(B[y])+'</mark>'; y++; } }
    while (y<n){ out += B[y]==='　' ? '　' : '<mark>'+esc(B[y])+'</mark>'; y++; }
    return out;
  }
  function toZhNum(n){
    var d='〇一二三四五六七八九';
    if (n<10) return d[n];
    var tens=Math.floor(n/10), ones=n%10;
    return (tens>1?d[tens]:'') + '十' + (ones?d[ones]:'');
  }

  var fullList = document.getElementById('fullList'), fullEnd = document.getElementById('fullEnd'), fab = document.getElementById('fab');
  function fullHTML(){
    var h='';
    for (var k=0;k<N;k++){
      var l=L[k];
      h += '<li data-k="' + k + '" class="' + (k===state.i && !state.done ? 'cur' : '') + '" tabindex="0" role="button" aria-label="Open phrase ' + (k+1) + '">' +
        '<div class="eyebrow"><span class="num">第' + toZhNum(l.n) + '句</span><span class="ref">' + esc(l.ref.replace('T20n1060_p','20.1060.')) + '</span>' + (l.lit !== String(l.n) ? '<span class="ref">liturgical ' + esc(l.lit) + '</span>' : '') + '</div>' +
        '<div class="zh-line" lang="zh-Hant">' + esc(l.zh) + (l.note_zh ? '<span class="g">(' + esc(l.note_zh) + ')</span>' : '') + '</div>' +
        ((l.zh_lit && l.zh_lit.replace(/　/g,'') !== l.zh) ? '<div class="lit-line' + (state.show.lit?'':' lang-hidden') + '" lang="zh-Hant"><span class="k">As sung</span>' + markDiff(l.zh, l.zh_lit) + '</div>' : '') +
        '<div class="sa-line' + (state.show.sa?'':' lang-hidden') + '" lang="sa-Latn">' + esc(l.sa) + '</div>' +
        '<div class="en-line' + (state.show.en?'':' lang-hidden') + '" lang="en">' + esc(l.en) + '</div>' +
        '<div class="gl-line' + (state.show.gl?'':' lang-hidden') + '" lang="zh-Hant">' + esc(l.zh_gloss) + '</div>' +
        '</li>';
    }
    return h;
  }
  function paintFull(){
    fullList.innerHTML = fullHTML();
    fullEnd.textContent = N + ' phrases · ' + fmt(zhChars.length) + ' characters · Taishō ' + S.dharani_span;
  }
  function setFull(on){
    state.full = !!on;
    document.body.classList.toggle('mode-full', state.full);
    fab.setAttribute('aria-pressed', String(state.full));
    fab.setAttribute('aria-label', state.full ? 'Return to one phrase at a time' : 'Show the full text');
    fab.title = state.full ? 'One phrase at a time' : 'Full text';
    if (state.full){
      paintFull();
      var cur = fullList.querySelector('li.cur');
      if (cur) cur.scrollIntoView({ block:'center', behavior: reduce ? 'auto' : 'smooth' });
    }
    persist();
  }
  function paint(){
    card.innerHTML = state.done ? doneHTML() : lineHTML(L[state.i]);
    if (state.full) paintFull();
    counter.innerHTML = state.done ? '<b>' + N + '</b> / ' + N : '<b>' + (state.i+1) + '</b> / ' + N;
    for (var k=0;k<N;k++){ ticks[k].className = state.done ? 'on' : (k<state.i ? 'on' : (k===state.i ? 'cur' : '')); }
    backBtn.disabled = state.i===0 && !state.done;
    hint.textContent = state.done ? 'Tap to start over' : (state.i===N-1 ? 'Tap to finish' : 'Tap to continue');
    if (document.body.classList.contains('open')) renderDrawer();
  }

  var busy=false;
  function transition(update){
    if (busy) return; busy=true;
    if (reduce){ update(); paint(); persist(); busy=false; return; }
    card.classList.add('is-out');
    setTimeout(function(){
      update(); paint(); persist();
      card.classList.remove('is-out'); card.classList.add('is-in');
      // force reflow so the fade-in animates from the offset state
      void card.offsetWidth;
      card.classList.remove('is-in');
      setTimeout(function(){ busy=false; }, 200);
    }, 240);
  }
  function next(){
    transition(function(){
      if (state.done){ state.done=false; state.i=0; return; }
      if (state.i >= N-1){ state.done=true; state.seen=N; return; }
      state.i++; state.seen=Math.max(state.seen,state.i);
    });
  }
  function prev(){
    if (state.i===0 && !state.done) return;
    transition(function(){ if (state.done){ state.done=false; state.i=N-1; } else state.i--; });
  }
  function jump(i){ transition(function(){ state.done=false; state.i=i; state.seen=Math.max(state.seen,i); }); }

  // ---------- drawer ----------
  var dbody = document.getElementById('dbody');
  function row(label, value, sub, unit){
    return '<dt>' + label + (sub?'<small>'+sub+'</small>':'') + '</dt><dd>' + value + (unit?'<small>'+unit+'</small>':'') + '</dd>';
  }
  function renderDrawer(){
    var pos = state.done ? N : state.i+1;
    var pct = Math.round(pos/N*100);
    var h = '';
    h += '<section class="sec"><h3>Reading</h3><dl>' +
      row('Current phrase', pos + ' / ' + N) +
      row('Progress', pct, null, '%') +
      row('Furthest phrase reached', Math.max(state.seen, pos)) +
      row('Phrases remaining', N - pos) +
      '</dl><div class="btnrow"><button class="btn primary" id="restartBtn">Start over</button><button class="btn" id="lastBtn">Go to last phrase</button></div></section>';

    h += '<section class="sec"><h3>The dhāraṇī</h3><dl>' +
      row('Phrases in the Taishō text', N, 'numbered 一 to 八十二 in the canon itself') +
      row('Lines in the recitation edition', 84, 'phrase 81 is chanted as three lines') +
      row('Chinese characters', fmt(zhChars.length), 'phonetic transliteration, Bhagavaddharma') +
      row('Distinct Chinese characters', fmt(zhUnique)) +
      row('Sanskrit words', fmt(saWords.length), 'Chandra’s reconstruction, hyphen-joined words counted once') +
      row('English words', fmt(enWords), 'gloss') +
      row('Chinese gloss characters', fmt(glChars.length), '釋義') +
      row('Occurrences of svāhā', svaha, '娑婆訶') +
      row('Phrases naming Nīlakaṇṭha', nila, '那囉謹墀') +
      row('Longest phrase', cjkChars(longest.zh).length, '第' + toZhNum(longest.n) + '句 ' + esc(longest.zh), 'chars') +
      row('Shortest phrase', cjkChars(shortest.zh).length, '第' + toZhNum(shortest.n) + '句 ' + esc(shortest.zh), 'char') +
      row('Taishō lines the dhāraṇī occupies', refs, S.dharani_span) +
      '</dl></section>';

    var R = DATA.recitation || {};
    h += '<section class="sec"><h3>Against the recitation text</h3><dl>' +
      row('Lines as sung', R.lines || 84, 'received 84-line text, Imee Ooi rendition') +
      row('Characters as sung', fmt(R.chars || 0), 'Taishō has ' + fmt(zhChars.length)) +
      row('Phrases that differ', litDiff, 'mostly homophonous variant characters') +
      row('Phrases identical', N - litDiff) +
      row('Characters added in phrase 16', 5, '薩哆那摩婆 repeated') +
      '</dl></section>';

    h += '<section class="sec"><h3>The sutra it belongs to</h3><dl>' +
      row('Taishō pages', 6, 'vol. 20, pp. 106–111') +
      row('Page registers (a · b · c)', S.page_count_taisho, S.pages_taisho) +
      row('Taishō lines', fmt(S.lines_taisho)) +
      row('Chinese characters in the sutra', fmt(S.cjk_chars_body), 'body text, notes excluded') +
      row('Share taken by the dhāraṇī', (zhChars.length / S.cjk_chars_body * 100).toFixed(1), null, '%') +
      '</dl></section>';

    h += '<section class="sec"><h3>Show</h3><div class="toggles">' +
      '<label><span>Sanskrit reconstruction</span><input type="checkbox" id="tg-sa"' + (state.show.sa?' checked':'') + '></label>' +
      '<label><span>English gloss</span><input type="checkbox" id="tg-en"' + (state.show.en?' checked':'') + '></label>' +
      '<label><span>Chinese gloss 釋義</span><input type="checkbox" id="tg-gl"' + (state.show.gl?' checked':'') + '></label>' +
      '<label><span>Recitation variant where it differs</span><input type="checkbox" id="tg-lit"' + (state.show.lit?' checked':'') + '></label>' +
      '</div></section>';

    h += '<section class="sec"><h3>Jump to a phrase</h3><div class="jump">';
    for (var k=0;k<N;k++){ h += '<button data-j="' + k + '" class="' + (k===state.i && !state.done ? 'on' : (k<state.seen ? 'seen' : '')) + '" aria-label="Phrase ' + (k+1) + '">' + (k+1) + '</button>'; }
    h += '</div></section>';

    h += '<section class="sec"><h3>Sources</h3>';
    DATA.sources.forEach(function(s){ h += '<p class="src"><b>' + esc(s.role) + '</b>' + esc(s.cite) + '</p>'; });
    h += '<p class="src">Translator of the Chinese text: ' + esc(S.translator_zh) + ' · ' + esc(S.translator_en) + '.</p>';
    h += '</section>';

    dbody.innerHTML = h;
    document.getElementById('restartBtn').onclick = function(){ closeDrawer(); jump(0); };
    document.getElementById('lastBtn').onclick = function(){ closeDrawer(); jump(N-1); };
    ['sa','en','gl','lit'].forEach(function(key){
      document.getElementById('tg-'+key).onchange = function(e){ state.show[key]=e.target.checked; persist(); paint(); };
    });
    Array.prototype.forEach.call(dbody.querySelectorAll('.jump button'), function(b){
      b.onclick = function(){ var j = +b.getAttribute('data-j'); closeDrawer(); jump(j); };
    });
  }

  var menuBtn = document.getElementById('menuBtn'), drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
  function openDrawer(){ renderDrawer(); document.body.classList.add('open'); drawer.setAttribute('aria-hidden','false'); menuBtn.setAttribute('aria-expanded','true'); }
  function closeDrawer(){ document.body.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); menuBtn.setAttribute('aria-expanded','false'); }
  menuBtn.addEventListener('click', function(e){ e.stopPropagation(); document.body.classList.contains('open') ? closeDrawer() : openDrawer(); });
  document.getElementById('closeBtn').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

  // ---------- input ----------
  fab.addEventListener('click', function(e){ e.stopPropagation(); setFull(!state.full); });
  fullList.addEventListener('click', function(e){
    var li = e.target.closest('li[data-k]'); if (!li) return;
    var k = +li.getAttribute('data-k');
    state.done=false; state.i=k; state.seen=Math.max(state.seen,k);
    setFull(false); paint(); persist();
  });
  fullList.addEventListener('keydown', function(e){ if ((e.key==='Enter'||e.key===' ') && e.target.matches('li[data-k]')){ e.preventDefault(); e.target.click(); } });
  var stage = document.getElementById('stage');
  stage.addEventListener('click', function(){ if (!document.body.classList.contains('open')) next(); });
  backBtn.addEventListener('click', function(e){ e.stopPropagation(); prev(); });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ closeDrawer(); return; }
    if (document.body.classList.contains('open')) return;
    if (e.key==='f' || e.key==='F'){ setFull(!state.full); return; }
    if (state.full) return;
    if (e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' ' || e.key==='Enter'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft' || e.key==='ArrowUp' || e.key==='Backspace'){ e.preventDefault(); prev(); }
    else if (e.key==='m' || e.key==='M'){ openDrawer(); }
  });

  paint();
  if (state.full) setFull(true);
})();
</script>
<!--ARTIFACT-END-->
</body>
</html>
