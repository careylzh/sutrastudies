<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Sutra Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --bg:#ECEAF1; --surface:#F8F7FB; --ink:#1E1A2B; --muted:#6D6880; --faint:#A9A4B8;
    --hair:rgba(30,26,43,.14); --seal:#A8352A; --gold:#8E7230; --scrim:rgba(30,26,43,.42);
    --shadow:0 24px 60px rgba(30,26,43,.18);
    --zh:"Noto Serif TC","Songti TC","Songti SC","PMingLiU","SimSun","Noto Serif CJK TC",serif;
    --sa:"Gentium Book Plus","Gentium Plus","Charis SIL","Georgia","Times New Roman",serif;
    --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12101A; --surface:#1B1826; --ink:#EDE9F5; --muted:#9A94AD; --faint:#5F5A72;
      --hair:rgba(237,233,245,.14); --seal:#D65A4C; --gold:#D2B064; --scrim:rgba(0,0,0,.55);
      --shadow:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12101A; --surface:#1B1826; --ink:#EDE9F5; --muted:#9A94AD; --faint:#5F5A72;
    --hair:rgba(237,233,245,.14); --seal:#D65A4C; --gold:#D2B064; --scrim:rgba(0,0,0,.55);
    --shadow:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:4px}

  .app{height:100%;display:flex;flex-direction:column;padding-inline:16px}

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;min-height:56px}
  .menu{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;border-radius:8px}
  .menu:hover{background:var(--hair)}
  .menu span{display:block;width:22px;height:2px;background:var(--ink);border-radius:1px;box-shadow:0 -7px 0 var(--ink),0 7px 0 var(--ink)}
  .bar-title{flex:1;text-align:center;min-width:0}
  .bar-title .zh{font-family:var(--zh);font-size:15px;letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-title .sa{font-family:var(--sa);font-size:12.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:56px;text-align:right;letter-spacing:.04em}
  .counter b{color:var(--ink);font-weight:500}

  /* stage */
  .stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
  .card{width:100%;max-width:640px;text-align:center;display:flex;flex-direction:column;gap:clamp(14px,3vh,26px);padding-block:8px;transition:opacity .26s ease, transform .26s ease}
  .card.is-out{opacity:0;transform:translateY(-6px)}
  .card.is-in{opacity:0;transform:translateY(8px)}
  .eyebrow{display:flex;justify-content:center;align-items:baseline;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .eyebrow .num{font-family:var(--zh);color:var(--seal);letter-spacing:.2em;font-size:13px;text-transform:none}
  .eyebrow .ref{font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .zh-line{font-family:var(--zh);font-weight:400;font-size:clamp(30px,7.6vw,50px);line-height:1.25;letter-spacing:.1em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
  .zh-line .g{color:var(--faint);font-size:.42em;letter-spacing:.1em;vertical-align:.35em;margin-left:.2em}
  .sa-line{font-family:var(--sa);font-size:clamp(21px,4.6vw,29px);line-height:1.3;color:var(--gold);text-wrap:balance}
  .en-line{font-family:var(--sa);font-style:italic;font-size:clamp(17px,3.6vw,21px);line-height:1.45;color:var(--ink);max-width:34em;margin:0 auto;text-wrap:balance}
  .gl-line{font-family:var(--zh);font-size:clamp(14px,3vw,16px);line-height:1.7;color:var(--muted);letter-spacing:.06em;text-wrap:balance}
  .rule{width:38px;height:1px;background:var(--hair);margin:0 auto}
  .lit-line{font-family:var(--zh);font-size:clamp(14px,3.2vw,17px);letter-spacing:.12em;color:var(--muted);margin-top:-6px}
  .lit-line .k{font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-right:10px;color:var(--faint)}
  .lit-line mark{background:none;color:var(--seal)}
  .lang-hidden{display:none}

  /* completion card */
  .done .zh-line{font-size:clamp(26px,6vw,40px)}
  .done p{margin:0;color:var(--muted);max-width:32em;margin-inline:auto}

  /* bottom */
  .foot{display:flex;align-items:center;gap:14px;padding-block:10px 16px;color:var(--muted);font-size:12.5px}
  .back{width:44px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
  .back:hover{background:var(--hair);color:var(--ink)}
  .back:disabled{opacity:.3;cursor:default;background:none}
  .track{flex:1;display:flex;gap:2px;height:14px;align-items:center}
  .track i{flex:1;height:3px;background:var(--hair);border-radius:1px;transition:background .3s}
  .track i.on{background:var(--seal)}
  .track i.cur{background:var(--ink);height:7px}
  .hint{flex:none;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
  @media (max-width:420px){.hint{display:none}}

  /* drawer */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);transform:translateX(-104%);transition:transform .32s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.open .scrim{opacity:1;pointer-events:auto}
  body.open .drawer{transform:none}
  .d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--hair)}
  .d-head h2{margin:0;font-family:var(--sa);font-weight:400;font-size:20px;letter-spacing:.01em}
  .d-head h2 small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  .close{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;font-size:22px;line-height:1;color:var(--muted)}
  .close:hover{background:var(--hair);color:var(--ink)}
  .d-body{overflow-y:auto;padding:6px 20px 24px;flex:1}
  .sec{padding-block:14px;border-bottom:1px solid var(--hair)}
  .sec:last-child{border-bottom:0}
  .sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  dl{margin:0;display:grid;grid-template-columns:1fr auto;column-gap:16px;row-gap:6px;align-items:baseline}
  dt{color:var(--ink)}
  dt small{display:block;color:var(--muted);font-size:12px}
  dd{margin:0;font-variant-numeric:tabular-nums;text-align:right;font-size:17px;font-family:var(--sa);white-space:nowrap}
  dd small{font-family:var(--ui);font-size:12px;color:var(--muted);margin-left:4px}
  .toggles{display:flex;flex-direction:column;gap:8px}
  .toggles label{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .toggles input{accent-color:var(--seal);width:18px;height:18px;margin:0}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .btn{padding:8px 14px;border:1px solid var(--hair);border-radius:6px;font-size:13.5px;letter-spacing:.02em}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--seal);color:#fff;border-color:var(--seal)}
  .jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
  .jump button{height:32px;border:1px solid var(--hair);border-radius:4px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .jump button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .jump button.seen{color:var(--ink);border-color:var(--seal)}
  .jump button:hover{border-color:var(--ink)}
  .src{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
  .src b{color:var(--ink);font-weight:500;display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
  .src a{color:var(--seal)}

  /* floating view toggle (icon only) */
  .fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;background:var(--surface);border:1px solid var(--hair);box-shadow:0 8px 24px rgba(30,26,43,.16);display:grid;place-items:center;color:var(--ink);z-index:5;transition:transform .2s, background .2s}
  .fab:hover{transform:translateY(-1px)}
  .fab:active{transform:scale(.96)}
  .fab svg{width:22px;height:22px;display:block}
  .fab .ic-full{display:block}.fab .ic-card{display:none}
  body.mode-full .fab .ic-full{display:none}body.mode-full .fab .ic-card{display:block}
  .foot{padding-right:62px}
  .scrim{z-index:10}.drawer{z-index:11}

  /* full-text view */
  .full{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 96px;-webkit-overflow-scrolling:touch}
  body.mode-full .stage,body.mode-full .foot{display:none}
  body.mode-full .full{display:block}
  .full ol{list-style:none;margin:0 auto;padding:0;max-width:640px}
  .full li{padding:18px 4px 20px;border-bottom:1px solid var(--hair);cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .full li:hover{background:var(--hair)}
  .full li.cur{box-shadow:inset 3px 0 0 var(--seal);padding-left:14px}
  .full .eyebrow{justify-content:flex-start;gap:12px}
  .full .zh-line{font-size:clamp(22px,5.4vw,30px);text-align:left;letter-spacing:.08em;line-height:1.35}
  .full .lit-line{font-size:14px;margin-top:0;text-align:left}
  .full .sa-line{font-size:clamp(17px,4vw,20px);text-align:left}
  .full .en-line{font-size:clamp(15px,3.4vw,17px);text-align:left;margin:0;max-width:none}
  .full .gl-line{font-size:14px;text-align:left}
  .full .end{color:var(--muted);text-align:center;font-size:13px;padding:28px 0 8px;letter-spacing:.06em}

  @media (prefers-reduced-motion: reduce){
    .card,.drawer,.scrim,.track i{transition:none}
  }

  /* ---------- library drawer ---------- */
  .d-body details{border-bottom:1px solid var(--hair)}
  .d-body details:last-child{border-bottom:0}
  .d-body summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding-block:14px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .d-body summary::-webkit-details-marker{display:none}
  .d-body summary::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
  .d-body details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
  .d-body details>.inner{padding-bottom:16px}
  .d-body details .sec{padding-block:0 14px;border:0}
  .d-body details .sec h3{margin-top:4px}
  .lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .lib button{width:100%;text-align:left;padding:10px 12px;border:1px solid var(--hair);border-radius:8px;display:flex;flex-direction:column;gap:2px}
  .lib button:hover{border-color:var(--ink)}
  .lib button[aria-current="true"]{border-color:var(--seal);box-shadow:inset 3px 0 0 var(--seal)}
  .lib .n{font-family:var(--zh);font-size:17px;letter-spacing:.06em}
  .lib .n[lang="sa-Latn"]{font-family:var(--sa);letter-spacing:.01em}
  .lib .e{font-size:13.5px}
  .lib .s{font-size:12px;color:var(--muted)}
  .lib .m{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .note{margin:0 0 12px;font-size:13.5px;line-height:1.55}
  .note .k{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .note .loc{font-variant-numeric:tabular-nums;color:var(--seal);margin-left:6px;text-transform:none;letter-spacing:.02em}
  .empty{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0;padding:10px 12px;border:1px dashed var(--hair);border-radius:8px}
  .concept{margin:0 0 12px}
  .concept b{display:block;font-weight:500}
  .concept p{margin:2px 0 0;font-size:13.5px}
  .concept small{color:var(--muted);font-size:12px}
  .scope{font-size:12px;color:var(--muted);margin:0 0 10px}

  /* ---------- mantra mode ---------- */
  .mantra-line{font-family:var(--sa);font-size:clamp(34px,9vw,60px);line-height:1.2;color:var(--gold);letter-spacing:.01em;text-wrap:balance}
  .tally{font-family:var(--sa);font-size:clamp(44px,12vw,76px);font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
  .tally-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-8px}
  .card.pulse .tally{animation:pulse .28s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  body.mode-mantra .track,body.mode-mantra .fab{display:none}
  body.mode-mantra .foot{padding-right:0}
  @media (prefers-reduced-motion: reduce){ .card.pulse .tally{animation:none} }

  /* ---------- responsive layer ---------- */
  /* phones: dynamic viewport height, notch-safe bars, short subtitle */
  .app{height:100vh;height:100dvh}
  .bar{padding-top:max(14px, env(safe-area-inset-top,0px))}
  .foot{padding-bottom:max(16px, env(safe-area-inset-bottom,0px))}
  .app{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  @media (max-width:520px){ .bar-title .sub{display:none} }
  /* closed drawer: no bleeding shadow, not reachable by keyboard */
  .drawer{visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1), visibility 0s linear .32s}
  body.open .drawer{visibility:visible;transition:transform .32s cubic-bezier(.2,.7,.2,1), visibility 0s}
  /* tablets and up: larger reading type */
  @media (min-width:768px) and (min-height:600px){
    .card{max-width:760px}
    .zh-line{font-size:clamp(40px,6.4vw,64px)}
    .sa-line{font-size:clamp(26px,3.4vw,34px)}
    .en-line{font-size:clamp(19px,2.4vw,24px)}
    .gl-line{font-size:17px}
    .mantra-line{font-size:clamp(52px,7vw,76px)}
    .full ol{max-width:760px}
    .foot{max-width:980px;width:100%;margin-inline:auto}
  }
  /* desktop: the drawer docks beside the text instead of covering it */
  @media (min-width:1100px){
    .app{transition:padding-left .32s cubic-bezier(.2,.7,.2,1)}
    body.open .app{padding-left:416px}
    body.open .scrim{opacity:0;pointer-events:none}
    .drawer{box-shadow:none;border-right:1px solid var(--hair)}
    body.open .drawer{box-shadow:none}
  }
  @media (min-width:1100px) and (prefers-reduced-motion: reduce){ .app{transition:none} }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <button class="menu" id="menuBtn" aria-label="Open the sutra library" aria-expanded="false" aria-controls="drawer"><span></span></button>
    <div class="bar-title">
      <div class="zh" id="barZh"></div>
      <div class="sa" id="barSa"></div>
    </div>
    <div class="counter" id="counter"></div>
  </header>

  <main class="stage" id="stage" role="button" tabindex="0" aria-label="Tap to advance">
    <div class="card" id="card" aria-live="polite"></div>
  </main>

  <section class="full" id="full" aria-label="Full text"><ol id="fullList"></ol><div class="end" id="fullEnd"></div></section>

  <footer class="foot">
    <button class="back" id="backBtn" aria-label="Previous line" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <div class="track" id="track" aria-hidden="true"></div>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<button class="fab" id="fab" aria-label="Show the full text" aria-pressed="false" title="Full text">
  <svg class="ic-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h11M4 18h7"/></svg>
  <svg class="ic-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 12h6"/></svg>
</button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle">
  <div class="d-head">
    <h2 id="drawerTitle">Library<small id="drawerSub"></small></h2>
    <button class="close" id="closeBtn" aria-label="Close">×</button>
  </div>
  <div class="d-body" id="dbody"></div>
</aside>

<script type="application/json" id="app-data">__DATA__</script>
<script>
(function(){
  var APP = JSON.parse(document.getElementById('app-data').textContent);
  var LIB = APP.library, KNOW = APP.knowledge;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var fmt = function(n){ return n.toLocaleString('en-US'); };
  var byId = function(id){ for (var k=0;k<LIB.length;k++) if (LIB[k].id===id) return LIB[k]; return null; };

  // ---------- persisted state ----------
  var KEY = 'sutrastudies-web';
  var store = { current: LIB[0].id, texts: {}, show: { sa:true, en:true, gl:true, lit:true }, open: { library:true, about:true, concepts:true } };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object'){
      if (byId(saved.current)) store.current = saved.current;
      store.texts = saved.texts || {};
      store.show = Object.assign(store.show, saved.show || {});
      store.open = Object.assign(store.open, saved.open || {});
    }
  } catch(e){}
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
  function ts(){ return store.texts[store.current] || (store.texts[store.current] = { i:0, seen:0, full:false, done:false, count:0 }); }

  // ---------- elements ----------
  var $ = function(id){ return document.getElementById(id); };
  var card=$('card'), counter=$('counter'), track=$('track'), backBtn=$('backBtn'), hint=$('hint'), stage=$('stage');
  var fullList=$('fullList'), fullEnd=$('fullEnd'), fab=$('fab'), dbody=$('dbody');
  var menuBtn=$('menuBtn'), drawer=$('drawer'), scrim=$('scrim');
  var dockMQ = matchMedia('(min-width:1100px)'), fineMQ = matchMedia('(hover:hover) and (pointer:fine)');
  function docked(){ return dockMQ.matches; }
  function isOpen(){ return document.body.classList.contains('open'); }
  function blocking(){ return isOpen() && !docked(); }

  // ---------- shared helpers ----------
  var isCJK = function(ch){ var c = ch.codePointAt(0); return (c>=0x3400&&c<=0x9FFF)||(c>=0x20000&&c<=0x2FFFF); };
  function cjkChars(s){ return Array.from(s).filter(isCJK); }
  function words(s){ return s.replace(/\([^)]*\)/g,' ').replace(/[\[\]().,;:?!’‘“”]/g,' ').split(/\s+/).filter(function(w){ return /[A-Za-zÀ-ɏḀ-ỿ]/.test(w); }); }
  function toZhNum(n){ var d='〇一二三四五六七八九'; if (n<10) return d[n]; var t=Math.floor(n/10), o=n%10; return (t>1?d[t]:'') + '十' + (o?d[o]:''); }
  function row(label, value, sub, unit){ return '<dt>' + label + (sub?'<small>'+sub+'</small>':'') + '</dt><dd>' + value + (unit?'<small>'+unit+'</small>':'') + '</dd>'; }
  function markDiff(a, b){
    var A=Array.from(a), B=Array.from(b), m=A.length, n=B.length, dp=[];
    for (var i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); }
    for (i=m-1;i>=0;i--) for (var j=n-1;j>=0;j--) dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    var out='', x=0, y=0;
    while (x<m && y<n){ if (A[x]===B[y]){ out+=esc(B[y]); x++; y++; } else if (dp[x+1][y] >= dp[x][y+1]) x++; else { out += B[y]==='　' ? '　' : '<mark>'+esc(B[y])+'</mark>'; y++; } }
    while (y<n){ out += B[y]==='　' ? '　' : '<mark>'+esc(B[y])+'</mark>'; y++; }
    return out;
  }
  function hid(key){ return store.show[key] ? '' : ' lang-hidden'; }

  // ---------- concepts: only reviewed entries from knowledge/exports/mindmap.json ----------
  function conceptsFor(entry){
    var ids = entry.source_ids || [];
    return (KNOW.concepts || []).filter(function(c){
      return c.review_status === 'reviewed' && c.source_ids.some(function(s){ return ids.indexOf(s) >= 0; });
    });
  }
  function conceptsHTML(entry){
    var list = conceptsFor(entry), h = '';
    if (!list.length){
      h += '<p class="empty">No reviewed concepts for this text yet. Concept summaries appear here only after the literature workstream publishes them, with claim and source records, in the reviewed knowledge export.' +
        (entry.source_ids && entry.source_ids.length ? ' Source ' + entry.source_ids.map(esc).join(', ') + ' is registered and awaiting appraisal.' : ' This text is not yet registered as a source.') + '</p>';
      return h;
    }
    list.forEach(function(c){
      h += '<div class="concept"><b>' + esc(c.label) + '</b><p>' + esc(c.plain_summary) + '</p><small>' +
        esc(c.traditions.join(' · ')) + ' · confidence ' + esc(c.confidence.replace('_',' ')) + ' · ' + esc(c.claim_ids.join(', ')) + '</small>' +
        (c.qualifications.length ? '<p><small>' + esc(c.qualifications.join(' ')) + '</small></p>' : '') + '</div>';
    });
    return h;
  }

  // ======================================================================
  // Mode: phrases (tap-through reader; data shape of nilakantha-T1060.json)
  // ======================================================================
  var Phrases = {
    setup: function(entry, D){
      this.D = D; this.L = D.lines; this.N = this.L.length;
      var L = this.L;
      var zhChars = cjkChars(L.map(function(l){return l.zh;}).join(''));
      this.st = {
        zhChars: zhChars.length,
        zhUnique: new Set(zhChars).size,
        glChars: cjkChars(L.map(function(l){return l.zh_gloss;}).join('')).length,
        saWords: words(L.map(function(l){return l.sa;}).join(' ').replace(/-\s+-/g,'')).length,
        enWords: L.reduce(function(a,l){ return a + words(l.en).length; }, 0),
        svaha: L.filter(function(l){ return /^svāhā$/i.test(l.sa.trim()); }).length,
        nila: L.filter(function(l){ return /nīlakaṇṭh/i.test(l.sa); }).length,
        longest: L.reduce(function(a,l){ return cjkChars(l.zh).length > cjkChars(a.zh).length ? l : a; }, L[0]),
        shortest: L.reduce(function(a,l){ return cjkChars(l.zh).length < cjkChars(a.zh).length ? l : a; }, L[0]),
        refs: new Set(L.map(function(l){return l.ref;})).size,
        litDiff: L.filter(function(l){ return l.zh_lit && l.zh_lit.replace(/　/g,'') !== l.zh; }).length
      };
      track.innerHTML = '';
      for (var k=0;k<this.N;k++) track.appendChild(document.createElement('i'));
      var s = ts(); s.i = Math.min(Math.max(s.i||0,0), this.N-1);
    },
    lineParts: function(l){
      var ref = '<span class="ref">Taishō ' + esc(l.ref.replace('T20n1060_p','20.1060.')) + '</span>' + (l.lit !== String(l.n) ? '<span class="ref">liturgical ' + esc(l.lit) + '</span>' : '');
      var h = '<div class="eyebrow"><span class="num">第' + toZhNum(l.n) + '句</span>' + ref + '</div>';
      h += '<div class="zh-line" lang="zh-Hant">' + esc(l.zh) + (l.note_zh ? '<span class="g">(' + esc(l.note_zh) + ')</span>' : '') + '</div>';
      if (l.zh_lit && l.zh_lit.replace(/　/g,'') !== l.zh) h += '<div class="lit-line' + hid('lit') + '" lang="zh-Hant"><span class="k">As sung</span>' + markDiff(l.zh, l.zh_lit) + '</div>';
      return h;
    },
    glosses: function(l){
      return '<div class="sa-line' + hid('sa') + '" lang="sa-Latn">' + esc(l.sa) + '</div>' +
        '<div class="en-line' + hid('en') + '" lang="en">' + esc(l.en) + '</div>' +
        '<div class="gl-line' + hid('gl') + '" lang="zh-Hant">' + esc(l.zh_gloss) + '</div>';
    },
    card: function(){
      var s = ts();
      if (s.done) return '<div class="done"><div class="eyebrow"><span class="num">圓滿</span><span class="ref">' + this.N + ' phrases · ' + fmt(this.st.zhChars) + ' characters</span></div>' +
        '<div class="zh-line" lang="zh-Hant">唵悉殿都　曼哆囉鉢馱耶　娑婆訶</div><div class="rule"></div>' +
        '<div class="sa-line" lang="sa-Latn">oṃ sidhyantu mantra-padāni svāhā</div>' +
        '<p>You have read the whole dhāraṇī as Bhagavaddharma set it down in the seventh century. Tap to begin again from the first phrase, or open the library for statistics and other texts.</p></div>';
      var l = this.L[s.i];
      return this.lineParts(l) + '<div class="rule"></div>' + this.glosses(l);
    },
    paint: function(){
      var s = ts(), N = this.N;
      counter.innerHTML = '<b>' + (s.done ? N : s.i+1) + '</b> / ' + N;
      var t = track.children;
      for (var k=0;k<N;k++) t[k].className = s.done ? 'on' : (k<s.i ? 'on' : (k===s.i ? 'cur' : ''));
      backBtn.disabled = s.i===0 && !s.done;
      backBtn.setAttribute('aria-label','Previous line');
      var v = fineMQ.matches ? 'Click or press →' : 'Tap';
      hint.textContent = s.done ? v + ' to start over' : (s.i===N-1 ? v + ' to finish' : v + ' to continue');
      stage.setAttribute('aria-label','Tap to advance to the next line');
      if (s.full) this.paintFull();
    },
    next: function(){ var s=ts(); if (s.done){ s.done=false; s.i=0; return; } if (s.i>=this.N-1){ s.done=true; s.seen=this.N; return; } s.i++; s.seen=Math.max(s.seen,s.i); },
    prev: function(){ var s=ts(); if (s.done){ s.done=false; s.i=this.N-1; } else if (s.i>0) s.i--; },
    canPrev: function(){ var s=ts(); return s.done || s.i>0; },
    paintFull: function(){
      var s = ts(), h = '';
      for (var k=0;k<this.N;k++){
        var l = this.L[k];
        h += '<li data-k="' + k + '" class="' + (k===s.i && !s.done ? 'cur' : '') + '" tabindex="0" role="button" aria-label="Open phrase ' + (k+1) + '">' + this.lineParts(l) + this.glosses(l) + '</li>';
      }
      fullList.innerHTML = h;
      fullEnd.textContent = this.N + ' phrases · ' + fmt(this.st.zhChars) + ' characters · Taishō ' + this.D.sutra.dharani_span;
    },
    drawer: function(){
      var s = ts(), N = this.N, st = this.st, S = this.D.sutra, R = this.D.recitation || {}, D = this.D;
      var pos = s.done ? N : s.i+1, h = '';
      h += section('reading', 'Reading', '<dl>' + row('Current phrase', pos + ' / ' + N) + row('Progress', Math.round(pos/N*100), null, '%') +
        row('Furthest phrase reached', Math.max(s.seen, pos)) + row('Phrases remaining', N - pos) + '</dl>' +
        '<div class="btnrow"><button class="btn primary" data-act="restart">Start over</button><button class="btn" data-act="last">Go to last phrase</button></div>');
      h += section('stats', 'Statistics', '<div class="sec"><h3>The dhāraṇī</h3><dl>' +
        row('Phrases in the Taishō text', N, 'numbered 一 to 八十二 in the canon itself') +
        row('Lines in the recitation edition', R.lines || 84, 'phrase 81 is chanted as three lines') +
        row('Chinese characters', fmt(st.zhChars), 'phonetic transliteration, Bhagavaddharma') +
        row('Distinct Chinese characters', fmt(st.zhUnique)) +
        row('Sanskrit words', fmt(st.saWords), 'Chandra’s reconstruction, hyphen-joined words counted once') +
        row('English words', fmt(st.enWords), 'gloss') +
        row('Chinese gloss characters', fmt(st.glChars), '釋義') +
        row('Occurrences of svāhā', st.svaha, '娑婆訶') +
        row('Phrases naming Nīlakaṇṭha', st.nila, '那囉謹墀') +
        row('Longest phrase', cjkChars(st.longest.zh).length, '第' + toZhNum(st.longest.n) + '句 ' + esc(st.longest.zh), 'chars') +
        row('Shortest phrase', cjkChars(st.shortest.zh).length, '第' + toZhNum(st.shortest.n) + '句 ' + esc(st.shortest.zh), 'char') +
        row('Taishō lines the dhāraṇī occupies', st.refs, S.dharani_span) + '</dl></div>' +
        '<div class="sec"><h3>Against the recitation text</h3><dl>' +
        row('Lines as sung', R.lines || 84, 'received 84-line text, Imee Ooi rendition') +
        row('Characters as sung', fmt(R.chars || 0), 'Taishō has ' + fmt(st.zhChars)) +
        row('Phrases that differ', st.litDiff, 'mostly homophonous variant characters') +
        row('Phrases identical', N - st.litDiff) +
        row('Characters added in phrase 16', 5, '薩哆那摩婆 repeated') + '</dl></div>' +
        '<div class="sec"><h3>The sutra it belongs to</h3><dl>' +
        row('Taishō pages', 6, 'vol. 20, pp. 106–111') +
        row('Page registers (a · b · c)', S.page_count_taisho, S.pages_taisho) +
        row('Taishō lines', fmt(S.lines_taisho)) +
        row('Chinese characters in the sutra', fmt(S.cjk_chars_body), 'body text, notes excluded') +
        row('Share taken by the dhāraṇī', (st.zhChars / S.cjk_chars_body * 100).toFixed(1), null, '%') + '</dl></div>');
      h += section('show', 'Show', '<div class="toggles">' +
        toggle('sa','Sanskrit reconstruction') + toggle('en','English gloss') + toggle('gl','Chinese gloss 釋義') + toggle('lit','Recitation variant where it differs') + '</div>');
      var j = '<div class="jump">';
      for (var k=0;k<N;k++) j += '<button data-j="' + k + '" class="' + (k===s.i && !s.done ? 'on' : (k<s.seen ? 'seen' : '')) + '" aria-label="Phrase ' + (k+1) + '">' + (k+1) + '</button>';
      h += section('jump', 'Jump to a phrase', j + '</div>');
      var src = '';
      D.sources.forEach(function(x){ src += '<p class="src"><b>' + esc(x.role) + '</b>' + esc(x.cite) + '</p>'; });
      src += '<p class="src">Translator of the Chinese text: ' + esc(S.translator_zh) + ' · ' + esc(S.translator_en) + '.</p>';
      h += section('sources', 'Sources', src);
      return h;
    },
    about: function(){
      var S = this.D.sutra;
      return '<p class="note"><span class="k">Text</span>' + esc(S.title_zh) + '<br>' + esc(S.canon) + ', vol. ' + S.vol + ', no. ' + S.no + ' · ' + esc(S.translator_en) + '</p>' +
        '<p class="note"><span class="k">What you are reading</span>The Chinese line is a phonetic transliteration of an Indic dhāraṇī, not a translation. The Sanskrit is a modern reconstruction, and the English and Chinese glosses are interpretive aids (see Sources).</p>';
    }
  };

  // ======================================================================
  // Mode: mantra (one mantra on the card; taps count repetitions)
  // ======================================================================
  var Mantra = {
    setup: function(entry, D){ this.D = D; track.innerHTML = ''; },
    card: function(){
      var D = this.D, s = ts();
      return '<div class="eyebrow"><span class="ref">' + esc(D.text.title_sa) + ' · ' + esc(D.text.canonical_id) + '</span></div>' +
        '<div class="mantra-line" lang="' + esc(D.mantra.lang) + '">' + esc(D.mantra.text) + '</div>' +
        '<div class="rule"></div>' +
        '<div class="tally" aria-label="Repetitions counted">' + fmt(s.count||0) + '</div><div class="tally-k">repetitions counted</div>' +
        '<div class="gl-line">' + esc(D.mantra.as_given) + '</div>';
    },
    paint: function(){
      var s = ts();
      counter.innerHTML = '<b>' + fmt(s.count||0) + '</b>';
      backBtn.disabled = !(s.count > 0);
      backBtn.setAttribute('aria-label','Undo last count');
      hint.textContent = fineMQ.matches ? 'Click or press space to count' : 'Tap to count';
      stage.setAttribute('aria-label','Tap to count one repetition');
    },
    next: function(){ var s=ts(); s.count=(s.count||0)+1; },
    prev: function(){ var s=ts(); if (s.count>0) s.count--; },
    canPrev: function(){ return ts().count > 0; },
    drawer: function(){
      var s = ts(), D = this.D;
      var h = section('count', 'Count', '<dl>' + row('Repetitions counted', fmt(s.count||0)) + '</dl>' +
        '<p class="scope">Counts are stored only in this browser.</p><div class="btnrow"><button class="btn primary" data-act="reset">Reset count</button></div>');
      var t = D.text;
      h += section('sources', 'Sources', '<p class="src"><b>Translation</b>' + esc(t.title_en) + ' (' + esc(t.title_sa) + ', ' + esc(t.canonical_id) + '). ' + esc(t.translators) + '. ' + esc(t.publisher) + ', ' + esc(t.version) + '. ' + esc(t.canon) + '. <a href="' + esc(t.url) + '" target="_blank" rel="noopener">' + esc(t.url.replace('https://','')) + '</a></p>' +
        '<p class="src"><b>License</b>' + esc(D.attribution) + '</p>');
      return h;
    },
    about: function(){
      var h = '';
      this.D.notes.forEach(function(n){ h += '<p class="note"><span class="k">' + esc(n.kind) + '<span class="loc">' + esc(n.locator) + '</span></span>' + esc(n.text) + '</p>'; });
      return h;
    }
  };

  var MODES = { phrases: Phrases, mantra: Mantra };
  var entry, mode;

  // ---------- drawer sections ----------
  function section(key, title, body){
    var open = store.open[key] !== undefined ? store.open[key] : false;
    return '<details data-sec="' + key + '"' + (open ? ' open' : '') + '><summary>' + esc(title) + '</summary><div class="inner">' + body + '</div></details>';
  }
  function toggle(key, label){ return '<label><span>' + label + '</span><input type="checkbox" data-tg="' + key + '"' + (store.show[key]?' checked':'') + '></label>'; }
  function libraryHTML(){
    var h = '<ul class="lib">';
    LIB.forEach(function(e){
      h += '<li><button data-text="' + esc(e.id) + '" aria-current="' + (e.id===entry.id) + '">' +
        '<span class="m">' + (e.mode === 'mantra' ? 'Mantra · count' : 'Read · phrase by phrase') + '</span>' +
        '<span class="n" lang="' + esc(e.native_lang) + '">' + esc(e.title_native) + '</span>' +
        '<span class="e">' + esc(e.title_en) + '</span><span class="s">' + esc(e.subtitle) + '</span></button></li>';
    });
    return h + '</ul>';
  }
  function renderDrawer(){
    $('drawerSub').textContent = LIB.length + ' curated texts';
    var h = section('library', 'Texts', libraryHTML());
    h += section('about', 'About this text', '<p class="scope">' + esc(entry.tradition) + '</p>' + mode.about());
    h += section('concepts', 'Concepts', conceptsHTML(entry));
    h += mode.drawer();
    dbody.innerHTML = h;
  }
  dbody.addEventListener('toggle', function(e){
    var d = e.target; if (d.tagName !== 'DETAILS') return;
    store.open[d.getAttribute('data-sec')] = d.open; persist();
  }, true);
  dbody.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var s = ts();
    if (b.hasAttribute('data-text')){ var id=b.getAttribute('data-text'); closeModal(); if (id!==entry.id) selectText(id, true); return; }
    if (b.hasAttribute('data-j')){ var j=+b.getAttribute('data-j'); closeModal(); transition(function(){ s.done=false; s.i=j; s.seen=Math.max(s.seen,j); }); return; }
    var act = b.getAttribute('data-act');
    if (act==='restart'){ closeModal(); transition(function(){ s.done=false; s.i=0; }); }
    else if (act==='last'){ closeModal(); transition(function(){ s.done=false; s.i=Phrases.N-1; s.seen=Phrases.N-1; }); }
    else if (act==='reset'){ s.count=0; persist(); paint(); }
  });
  dbody.addEventListener('change', function(e){
    var k = e.target.getAttribute('data-tg'); if (!k) return;
    store.show[k] = e.target.checked; persist(); paint();
  });

  // ---------- painting & transitions ----------
  function paint(){
    card.innerHTML = mode.card();
    mode.paint();
    if (isOpen()) renderDrawer();
  }
  var busy=false;
  function transition(update){
    if (busy) return; busy=true;
    if (reduce){ update(); paint(); persist(); busy=false; return; }
    card.classList.add('is-out');
    setTimeout(function(){
      update(); paint(); persist();
      card.classList.remove('is-out'); card.classList.add('is-in');
      void card.offsetWidth;
      card.classList.remove('is-in');
      setTimeout(function(){ busy=false; }, 200);
    }, 240);
  }
  function advance(){
    if (entry.mode === 'mantra'){ mode.next(); paint(); persist(); card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse'); return; }
    transition(function(){ mode.next(); });
  }
  function back(){
    if (!mode.canPrev()) return;
    if (entry.mode === 'mantra'){ mode.prev(); paint(); persist(); return; }
    transition(function(){ mode.prev(); });
  }
  function setFull(on){
    var s = ts();
    s.full = !!on && entry.mode === 'phrases';
    document.body.classList.toggle('mode-full', s.full);
    fab.setAttribute('aria-pressed', String(s.full));
    fab.setAttribute('aria-label', s.full ? 'Return to one phrase at a time' : 'Show the full text');
    fab.title = s.full ? 'One phrase at a time' : 'Full text';
    if (s.full){ mode.paintFull(); var cur = fullList.querySelector('li.cur'); if (cur) cur.scrollIntoView({ block:'center', behavior: reduce ? 'auto' : 'smooth' }); }
    persist();
  }
  function selectText(id, animate){
    var apply = function(){
      entry = byId(id) || LIB[0]; store.current = entry.id; mode = MODES[entry.mode];
      mode.setup(entry, APP.texts[entry.id]);
      document.body.classList.toggle('mode-mantra', entry.mode === 'mantra');
      var bz = $('barZh'); bz.textContent = entry.title_native; bz.lang = entry.native_lang;
      bz.style.fontFamily = entry.native_lang === 'sa-Latn' ? 'var(--sa)' : '';
      $('barSa').innerHTML = esc(entry.title_en) + '<span class="sub"> · ' + esc(entry.subtitle) + '</span>';
      document.title = entry.title_en + ' · Sutra Studies';
    };
    if (animate && !reduce){ transition(function(){ apply(); }); setTimeout(function(){ setFull(ts().full); }, 260); }
    else { apply(); paint(); persist(); setFull(ts().full); }
  }

  // ---------- drawer open/close ----------
  function syncRole(){
    if (docked()){ drawer.setAttribute('role','complementary'); drawer.removeAttribute('aria-modal'); }
    else { drawer.setAttribute('role','dialog'); drawer.setAttribute('aria-modal','true'); }
  }
  function openDrawer(focus){
    syncRole(); renderDrawer(); document.body.classList.add('open'); drawer.setAttribute('aria-hidden','false'); menuBtn.setAttribute('aria-expanded','true');
    if (docked()){ store.docked = true; persist(); }
    if (focus !== false) $('closeBtn').focus();
  }
  function closeDrawer(){
    if (!isOpen()) return;
    document.body.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); menuBtn.setAttribute('aria-expanded','false');
    if (docked()){ store.docked = false; persist(); }
    menuBtn.focus();
  }
  function closeModal(){ if (!docked()) closeDrawer(); }
  dockMQ.addEventListener('change', syncRole);
  fineMQ.addEventListener('change', function(){ mode.paint(); });
  menuBtn.addEventListener('click', function(e){ e.stopPropagation(); isOpen() ? closeDrawer() : openDrawer(); });
  $('closeBtn').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

  // ---------- input ----------
  fab.addEventListener('click', function(e){ e.stopPropagation(); setFull(!ts().full); });
  fullList.addEventListener('click', function(e){
    var li = e.target.closest('li[data-k]'); if (!li) return;
    var k = +li.getAttribute('data-k'), s = ts();
    s.done=false; s.i=k; s.seen=Math.max(s.seen,k);
    setFull(false); paint(); persist();
  });
  fullList.addEventListener('keydown', function(e){ if ((e.key==='Enter'||e.key===' ') && e.target.matches('li[data-k]')){ e.preventDefault(); e.target.click(); } });
  stage.addEventListener('click', function(){ if (!blocking()) advance(); });
  backBtn.addEventListener('click', function(e){ e.stopPropagation(); back(); });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ closeDrawer(); return; }
    if (blocking()) return;
    if (e.target.closest && e.target.closest('#drawer')) return;
    if (e.target.closest && e.target.closest('button:not(#stage), input, summary')) { if (e.key===' '||e.key==='Enter') return; }
    if ((e.key==='f' || e.key==='F') && entry.mode==='phrases'){ setFull(!ts().full); return; }
    if (e.key==='m' || e.key==='M'){ openDrawer(); return; }
    if (ts().full) return;
    if (e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' ' || e.key==='Enter'){ e.preventDefault(); advance(); }
    else if (e.key==='ArrowLeft' || e.key==='ArrowUp' || e.key==='Backspace'){ e.preventDefault(); back(); }
  });

  selectText(store.current, false);
  if (docked() && store.docked) openDrawer(false);
})();
</script>
<!--ARTIFACT-END-->
